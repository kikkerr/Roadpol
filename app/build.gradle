plugins { id 'com.android.application' }

def roadpolKeystore = file('roadpol.keystore')

android {
    namespace 'be.verkeersapp.app'
    compileSdk 34
    defaultConfig {
        applicationId 'be.verkeersapp.app'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '3.0'
    }
    signingConfigs {
        roadpol {
            storeFile roadpolKeystore
            storePassword 'roadpol123'
            keyAlias 'roadpol'
            keyPassword 'roadpol123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // vaste sleutel: nieuwe versies installeren dan over de vorige heen
            signingConfig(roadpolKeystore.exists() ? signingConfigs.roadpol : signingConfigs.debug)
        }
    }
}
